<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Business Demo</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .container {
      padding: 60px 20px;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 25px;
      background: #3b82f6;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
    }

    .section {
      margin-top: 60px;
    }

    .card {
      background: #1e293b;
      padding: 20px;
      margin: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 id="name">Your Business Name</h1>
    <p id="line">We help you get more customers</p>
    <button class="btn">Book Now</button>

    <div class="section">
      <h2>Our Services</h2>
      <div class="card">High Quality Service</div>
      <div class="card">Affordable Pricing</div>
      <div class="card">Trusted by Customers</div>
    </div>

    <div class="section">
      <h2>Why Choose Us</h2>
      <p>We provide the best experience for your business growth.</p>
    </div>
  </div>

  <script>
    const p = new URLSearchParams(window.location.search);

    document.getElementById("name").innerText =
      p.get("name") || "Your Business Name";

    document.getElementById("line").innerText =
      p.get("line") || "We help you get more customers";
  </script>

</body>
</html>
