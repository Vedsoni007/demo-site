<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Demo</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: #0f172a;
  color: white;
}

.container {
  padding: 40px 20px;
  text-align: center;
}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

p {
  opacity: 0.8;
}

.btn {
  margin-top: 20px;
  padding: 14px 30px;
  background: #22c55e;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  color: white;
}

.section {
  margin-top: 60px;
}

.cards {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  background: #1e293b;
  padding: 20px;
  margin: 10px;
  border-radius: 10px;
  width: 250px;
}

.testimonial {
  font-style: italic;
  margin-top: 10px;
}

</style>
</head>

<body>

<div class="container">
  <h1 id="name">Your Business Name</h1>
  <p id="line">We help you get more customers</p>

  <a id="whatsapp" href="#">
    <button class="btn">Contact on WhatsApp</button>
  </a>

  <div class="section">
    <h2>Our Services</h2>
    <div class="cards" id="services">
      <div class="card">Service 1</div>
      <div class="card">Service 2</div>
      <div class="card">Service 3</div>
    </div>
  </div>

  <div class="section">
    <h2>Why Choose Us</h2>
    <p id="location">Trusted by 100+ customers</p>
  </div>

  <div class="section">
    <h2>What Customers Say</h2>
    <p class="testimonial">"Amazing service! Highly recommended."</p>
  </div>
</div>

<script>
const p = new URLSearchParams(window.location.search);

const name = p.get("name") || "Your Business Name";
const line = p.get("line") || "We help you grow";
const city = p.get("city") || "your city";
const phone = p.get("phone") || "91XXXXXXXXXX";

document.getElementById("name").innerText = name;
document.getElementById("line").innerText = line;
document.getElementById("location").innerText =
  "Trusted by 100+ customers in " + city;

document.getElementById("whatsapp").href =
  "https://wa.me/" + phone;
</script>

</body>
</html>
